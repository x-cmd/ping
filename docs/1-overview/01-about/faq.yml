id: x-1-overview-01-about

data:
  - name:
      en: Why one ping is not enough
      cn: 为什么一次 ping 不够
    qa:
      - id: why-many-probes
        question:
      en: Why measure from many probes instead of just my own machine?
      cn: 为什么要从多个探针测，而不是只从自己机器测？
        answer:
          en: >
            Because one vantage point tells you one thing: how far your network is from the target. From Frankfurt, 1.1.1.1 answered in under 1 ms; from Buffalo the same second answered in 12 ms. Both were true at the same moment. Only a multi-probe measurement separates "it is slow here" from "it is slow everywhere" — and it changes what the data is a sample of, from one path out of many to the distribution of paths.
          cn: >
            因为一个观测点只能说明一件事：你的网络离目标有多远。从法兰克福测 1.1.1.1 不到 1 ms，从布法罗测同一秒是 12 ms。同一时刻两者都成立。只有多点测量才能把「我这边慢」和「大家都慢」分开 —— 它改变的是这份数据在给谁做样本：从千万条路径中的一条，变成路径的分布。
        confidence: 10
        reference:
          - docs/1-overview/01-about/en.md
          - docs/1-overview/01-about/cn.md
