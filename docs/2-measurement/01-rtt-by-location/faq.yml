id: x-2-measurement-01-rtt-by-location

data:
  - name:
      en: Round-trip time, by probe
      cn: 按探针看往返时延
    qa:
      - id: why-is-buffalo-slow
        question:
      en: Why is Buffalo 12 ms when Tokyo is 1.3 ms?
      cn: 为什么布法罗 12 ms 而东京只有 1.3 ms？
        answer:
          en: >
            1.1.1.1 is anycast, so the measurement is really "distance to the nearest Cloudflare point". Buffalo's HostPapa network is landing on a Cloudflare edge that is simply far away — a routing/peering fact, not a property of the target. It is exactly the kind of problem a single ping cannot reveal and a 18-probe measurement makes obvious.
          cn: >
            1.1.1.1 是 anycast，所以实际测的是「到最近 Cloudflare 节点的物理距离」。布法罗的 HostPapa 网络恰好落在了一个很远的 Cloudflare 边缘节点上——这是路由与互联的事实，跟目标本身无关。这正是单次 ping 看不出来的、18 点测量一下就一目了然的那类问题。
        confidence: 10
        reference:
          - docs/2-measurement/01-rtt-by-location/en.md
          - docs/2-measurement/01-rtt-by-location/cn.md
